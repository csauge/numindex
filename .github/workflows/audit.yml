name: Weekly EcoIndex & Lighthouse Audit

on:
  schedule:
    - cron: '0 4 * * 0' # Tous les dimanches à 4h00 UTC
  workflow_dispatch: # Permet le lancement manuel

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright system deps
        run: sudo DEBIAN_FRONTEND=noninteractive npx playwright install-deps chromium

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Build project
        run: npm run build

      - name: Run Lighthouse Audit
        run: npx @lhci/cli autorun
        continue-on-error: true
        env:
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run EcoIndex Audit (Custom Playwright Script)
        run: node scripts/run-ecoindex.mjs
        continue-on-error: true
        
      - name: Generate SVG Badges
        run: node scripts/generate-badges.mjs

      - name: Commit and push badges
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/badge-*.svg
          git commit -m "chore: update ecoindex and lighthouse badges [skip ci]" || echo "No changes to commit"
          git push || echo "No changes to push"
